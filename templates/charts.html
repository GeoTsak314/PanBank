{% extends 'base.html' %}{% block title %}Charts{% endblock %}{% block content %}<form method="get" class="toolbar"><select name="chart"><option value="flow" {{'selected' if chart=='flow' else ''}}>Income vs expenses</option><option value="unregistered" {{'selected' if chart=='unregistered' else ''}}>Unregistered expenses</option><option value="balances" {{'selected' if chart=='balances' else ''}}>Closing balances</option></select><input name="year" type="number" value="{{year}}"><button>View</button></form><div class="card"><div id="plot" style="height:350px;display:flex;align-items:end;gap:10px;border-bottom:1px solid #aaa;padding:20px 12px 30px;position:relative"></div></div>
<script>let a={{series|tojson}},b={{series2|tojson}},p=document.getElementById('plot');let max=Math.max(1,...a.map(Math.abs),...(b||[]).map(Math.abs));for(let i=0;i<12;i++){let c=document.createElement('div');c.style.cssText='flex:1;display:flex;align-items:end;justify-content:center;position:relative;height:100%;gap:2px';let vals=b?[a[i],b[i]]:[a[i]];vals.forEach((v,j)=>{let bar=document.createElement('div');bar.style.cssText='flex:1;min-width:2px;background:'+(j?'#df9d63':'#3679ae')+';height:'+Math.max(1,Math.abs(v)/max*100)+'%;opacity:'+(v<0?.45:1);bar.title=(v/100).toFixed(2)+' EUR';c.append(bar)});let label=document.createElement('span');label.textContent=i+1;label.style.cssText='position:absolute;bottom:-22px;font:11px sans-serif;color:#637587';c.append(label);p.append(c)}</script><p class="muted">Blue: allocated income or selected series; orange: registered expenses. Annual allocation and incomplete snapshots can affect chart interpretation.</p>{% endblock %}
