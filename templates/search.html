{% extends 'base.html' %}{% block title %}Global Search{% endblock %}{% block content %}<form method="get" class="toolbar"><input name="q" placeholder="Search text" value="{{q}}"><input name="amount" placeholder="Exact amount 1345.50" value="{{amount}}"><select name="kind"><option value="all">All registers</option>{% for n in names %}<option value="{{n}}" {{'selected' if kind==n else ''}}>{{n}}</option>{% endfor %}</select><button>Search</button><a class="button secondary" href="/search">Clear</a></form><div class="card table-wrap"><table><tr><th>Register</th><th>ID</th><th>Details</th></tr>{% for name,id,info in rows %}<tr><td>{{name}}</td><td><a href="/edit/{{name|urlencode}}/{{id}}">{{id}}</a></td><td>{{info}}</td></tr>{% endfor %}</table></div>{% endblock %}
